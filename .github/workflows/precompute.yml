name: Daily Precompute

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 17:00 WIB, Senin-Jumat (cron pakai UTC)
  workflow_dispatch: {}       # biar bisa trigger manual juga

permissions:
  contents: write

concurrency:
  group: precompute
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python precompute.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: daily precompute update"
          git push
